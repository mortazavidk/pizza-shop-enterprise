<!doctype html><meta charset="utf-8"><title>MIS Leaderboard</title><style>body{background:#101827;color:white;font:18px system-ui;padding:30px}table{border-collapse:collapse;width:100%}td,th{padding:12px;border-bottom:1px solid #64748b;text-align:left}a{color:skyblue}</style><h1>Instructor leaderboard</h1><a href="index.html">Back to missions</a><p>Import team JSON files. Results are local and self-reported.</p><input type="file" multiple accept=".json" id="files"><p id="errors"></p><table><thead><tr><th>Rank</th><th>Team</th><th>Members</th><th>Completed</th><th>Score</th></tr></thead><tbody id="rows"></tbody></table><script>const teams=new Map();document.getElementById('files').onchange=async e=>{let errors=[];for(const f of e.target.files){try{let d=JSON.parse(await f.text()),caps=[150,150,150,150,200,200];if(d.version!==1||typeof d.team!=='string'||!d.team.trim()||!d.scores||Object.entries(d.scores).some(([k,v])=>! /^[0-5]$/.test(k)||!Number.isInteger(v)||v<0||v>caps[+k]))throw Error();teams.set(d.team,{...d,total:Object.values(d.scores).reduce((a,b)=>a+b,0)})}catch{errors.push(f.name)}}document.getElementById('errors').textContent=errors.length?'Invalid files: '+errors.join(', '):'';let b=document.getElementById('rows');b.replaceChildren();let last=-1,rank=0;[...teams.values()].sort((a,b)=>b.total-a.total).forEach((d,i)=>{if(d.total!==last)rank=i+1;last=d.total;let r=b.insertRow();[rank,d.team,d.members||'',Object.keys(d.scores).length+'/6',d.total].forEach(v=>r.insertCell().textContent=v)})}</script>
